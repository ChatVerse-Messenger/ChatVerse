<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ChatVerse Messenger</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-main: #0b141a;
      --bg-sidebar: #111b21;
      --bg-header: #202c33;
      --bg-chat: #0b141a;
      --bg-input: #1d232a;
      --accent-primary: #00a884;
      --accent-hover: #00c89e;
      --text-main: #e9edef;
      --text-muted: #8696a0;
      --border-color: #222d34;
      --sidebar-width: 350px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { height: 100vh; background: var(--bg-main); color: var(--text-main); overflow: hidden; display: flex; }

    /* --- ANIMATIONS --- */
    @keyframes rainbowText {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .rainbow-text {
      background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowText 3s linear infinite;
      font-weight: bold;
    }
    .owner-badge {
      background: linear-gradient(135deg, #00c89e, #005c4b);
      color: white; font-size: 10px; padding: 2px 8px; border-radius: 4px;
      margin-left: 8px; font-weight: 800; text-transform: uppercase;
    }

    /* --- SIDEBAR RESIZER --- */
    .resizer {
      width: 4px; cursor: col-resize; background: transparent; transition: 0.2s;
    }
    .resizer:hover { background: var(--accent-primary); }

    /* --- SIDEBAR --- */
    .sidebar { width: var(--sidebar-width); background: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid var(--border-color); }
    .sidebar-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-header); }
    .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #222; border: 1px solid rgba(255,255,255,0.1); }
    
    .new-chat-btn {
      background: var(--bg-input); color: white; border: 1px solid rgba(255,255,255,0.05);
      padding: 18px 20px; margin: 15px; border-radius: 12px; font-weight: 600;
      cursor: pointer; text-align: left; font-size: 16px;
    }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 15px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .chat-item.active { background: rgba(255,255,255,0.08); }

    /* --- MAIN CHAT --- */
    .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); position: relative; }
    .chat-header { padding: 15px; background: var(--bg-header); display: flex; align-items: center; gap: 15px; font-weight: bold; border-bottom: 1px solid var(--border-color); }
    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .message { max-width: 70%; padding: 10px 15px; border-radius: 12px; font-size: 14px; position: relative; }
    .sent { align-self: flex-end; background: var(--accent-primary); color: white; border-bottom-right-radius: 2px; }
    .received { align-self: flex-start; background: var(--bg-header); color: white; border-bottom-left-radius: 2px; }

    /* --- INPUT AREA & PICKERS --- */
    .input-area { padding: 15px; background: var(--bg-header); display: flex; gap: 12px; align-items: center; }
    .chat-field { flex: 1; background: var(--bg-input); border: none; padding: 12px 18px; border-radius: 25px; color: white; outline: none; }
    .icon-btn { color: var(--text-muted); font-size: 20px; cursor: pointer; background: none; border: none; }
    
    .picker-drawer { 
        position: absolute; bottom: 80px; left: 15px; width: 300px; height: 250px; 
        background: var(--bg-header); border-radius: 15px; display: none; 
        flex-direction: column; padding: 10px; z-index: 500; border: 1px solid var(--border-color);
    }
    .picker-drawer.active { display: flex; }
    .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; overflow-y: auto; font-size: 20px; }
    .emoji-grid span { cursor: pointer; padding: 5px; text-align: center; }

    /* --- PROFILE VIEW (Matches Screenshot) --- */
    .profile-view { position: fixed; inset: 0; background: #0f171e; z-index: 1000; display: none; flex-direction: column; }
    .profile-view.active { display: flex; }
    .profile-header { padding: 20px; display: flex; align-items: center; gap: 20px; font-size: 18px; font-weight: bold; background: var(--bg-header); }
    .profile-content { max-width: 400px; margin: 0 auto; width: 100%; padding: 40px 20px; text-align: center; }
    
    .pfp-wrapper { position: relative; display: inline-block; cursor: pointer; margin-bottom: 20px; }
    .pfp-large { width: 140px; height: 140px; border-radius: 50%; border: 4px solid #1d232a; object-fit: cover; }
    .cam-icon { position: absolute; bottom: 5px; right: 5px; background: var(--accent-primary); width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid #0f171e; color: white; }

    .input-group { text-align: left; margin-bottom: 20px; width: 100%; }
    .input-group label { display: block; color: var(--text-muted); font-size: 12px; margin-bottom: 8px; text-transform: uppercase; font-weight: bold; }
    .profile-input { width: 100%; background: var(--bg-input); border: 1px solid #2a333c; padding: 14px; border-radius: 10px; color: white; outline: none; }
    .save-btn { width: 100%; padding: 16px; background: var(--accent-primary); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; }

    /* --- AUTH --- */
    .auth-screen { position: fixed; inset: 0; background: var(--bg-main); z-index: 2000; display: flex; align-items: center; justify-content: center; }
    .auth-card { background: var(--bg-sidebar); padding: 40px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center; border: 1px solid var(--border-color); }
    
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <h1 style="color:var(--accent-primary); margin-bottom:10px">ChatVerse</h1>
      <div style="display:flex; background:var(--bg-input); border-radius:10px; padding:5px; margin-bottom:25px;">
        <button id="lBtn" style="flex:1; background:var(--accent-primary); border:none; color:white; padding:10px; border-radius:8px; cursor:pointer" onclick="setAuth('login')">Login</button>
        <button id="sBtn" style="flex:1; background:none; border:none; color:gray; padding:10px; cursor:pointer" onclick="setAuth('signup')">Sign Up</button>
      </div>
      <input type="text" id="authUser" class="profile-input" style="margin-bottom:10px" placeholder="Username">
      <input type="password" id="authPass" class="profile-input" style="margin-bottom:20px" placeholder="Password">
      <div id="signupOnly" class="hidden">
        <input type="text" id="authName" class="profile-input" style="margin-bottom:20px" placeholder="Display Name">
      </div>
      <button class="save-btn" onclick="handleAuth()">Continue</button>
    </div>
  </div>

  <!-- APP LAYOUT -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img id="myAvatar" src="" class="avatar" onclick="openProfile()" style="cursor:pointer">
      <span id="myName" style="font-weight:700"></span>
      <i class="fa-solid fa-right-from-bracket" style="cursor:pointer; color:gray" onclick="location.reload()"></i>
    </div>
    <button class="new-chat-btn" onclick="startNewChat()">New Chat</button>
    <div class="chat-list" id="chatList"></div>
  </div>

  <div class="resizer" id="dragHandle"></div>

  <div class="main-chat">
    <div class="chat-header" id="chatHeader">Select a chat</div>
    <div class="chat-messages" id="chatMessages"></div>
    
    <div class="picker-drawer" id="picker">
        <div class="emoji-grid" id="emojiGrid"></div>
    </div>

    <div class="input-area">
      <button class="icon-btn" onclick="document.getElementById('picker').classList.toggle('active')"><i class="fa-regular fa-face-smile"></i></button>
      <input type="text" id="msgInput" class="chat-field" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()" style="background:var(--accent-primary); color:white; border:none; width:40px; height:40px; border-radius:50%; cursor:pointer"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <!-- PROFILE VIEW -->
  <div id="profileView" class="profile-view">
    <div class="profile-header">
      <i class="fa-solid fa-arrow-left" onclick="closeProfile()" style="cursor:pointer"></i>
      <span>My Profile</span>
    </div>
    <div class="profile-content">
      <div class="pfp-wrapper" onclick="triggerFile()">
        <img id="profilePfp" src="" class="pfp-large">
        <div class="cam-icon"><i class="fa-solid fa-camera"></i></div>
        <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="processFile(this)">
      </div>
      <div style="font-size:22px; font-weight:bold; margin-bottom:5px;">
        <span id="previewName"></span><span id="previewBadge" class="owner-badge"></span>
      </div>
      <p style="color:gray; font-size:13px; margin-bottom:30px;">Click PFP above to change image</p>
      
      <div class="input-group">
        <label>Display Name</label>
        <input type="text" id="editName" class="profile-input">
      </div>
      <div class="input-group">
        <label>Custom Badge</label>
        <input type="text" id="editBadge" class="profile-input">
      </div>
      <button class="save-btn" onclick="saveProfile()">Save Profile</button>
    </div>
  </div>

  <script>
    const _KEY = "YXluem9uZWxvdmVyaXNraw==";
    let users = JSON.parse(localStorage.getItem('cv_users')) || {};
    let messages = JSON.parse(localStorage.getItem('cv_msgs')) || [];
    let currentUser = null;
    let activeChat = null;
    let authMode = 'login';

    // Sidebar Resize
    const handle = document.getElementById('dragHandle');
    const side = document.getElementById('sidebar');
    let isResizing = false;

    handle.addEventListener('mousedown', () => isResizing = true);
    document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        let w = e.clientX;
        if (w > 250 && w < 600) {
            side.style.width = w + 'px';
            document.documentElement.style.setProperty('--sidebar-width', w + 'px');
        }
    });
    document.addEventListener('mouseup', () => isResizing = false);

    // Auth
    function setAuth(m) {
        authMode = m;
        document.getElementById('lBtn').style.background = m === 'login' ? 'var(--accent-primary)' : 'none';
        document.getElementById('lBtn').style.color = m === 'login' ? 'white' : 'gray';
        document.getElementById('sBtn').style.background = m === 'signup' ? 'var(--accent-primary)' : 'none';
        document.getElementById('sBtn').style.color = m === 'signup' ? 'white' : 'gray';
        document.getElementById('signupOnly').classList.toggle('hidden', m === 'login');
    }

    function handleAuth() {
        const u = document.getElementById('authUser').value.trim().toLowerCase();
        const p = document.getElementById('authPass').value;
        if (!u || !p) return;

        if (authMode === 'login') {
            if (u === 'owner' && btoa(p) === _KEY) {
                if (!users[u]) users[u] = { username: 'owner', name: 'AynzonePlayz[OWNER]', badge: 'OWNER', pfp: 'https://api.dicebear.com/7.x/bottts/svg?seed=vampire' };
                currentUser = users[u];
            } else if (users[u] && users[u].password === p) {
                currentUser = users[u];
            } else { alert("Wrong details"); return; }
        } else {
            if (users[u]) { alert("Taken"); return; }
            users[u] = { username: u, password: p, name: document.getElementById('authName').value || u, badge: '', pfp: `https://api.dicebear.com/7.x/avataaars/svg?seed=${u}` };
            localStorage.setItem('cv_users', JSON.stringify(users));
            currentUser = users[u];
        }
        document.getElementById('authScreen').classList.add('hidden');
        initApp();
    }

    function initApp() {
        document.getElementById('myAvatar').src = currentUser.pfp;
        const n = document.getElementById('myName');
        n.innerText = currentUser.name;
        if (currentUser.username === 'owner') n.className = 'rainbow-text';
        renderChats();
    }

    // PFP Functionality
    function triggerFile() { document.getElementById('fileInput').click(); }
    function processFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 200; canvas.height = 200;
                    ctx.drawImage(img, 0, 0, 200, 200);
                    const data = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('profilePfp').src = data;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // Profile
    function openProfile() {
        document.getElementById('profilePfp').src = currentUser.pfp;
        document.getElementById('editName').value = currentUser.name;
        document.getElementById('editBadge').value = currentUser.badge;
        document.getElementById('previewName').innerText = currentUser.name;
        document.getElementById('previewBadge').innerText = currentUser.badge;
        document.getElementById('profileView').classList.add('active');
    }
    function closeProfile() { document.getElementById('profileView').classList.remove('active'); }
    function saveProfile() {
        currentUser.name = document.getElementById('editName').value;
        currentUser.badge = document.getElementById('editBadge').value;
        currentUser.pfp = document.getElementById('profilePfp').src;
        users[currentUser.username] = currentUser;
        localStorage.setItem('cv_users', JSON.stringify(users));
        initApp();
        closeProfile();
    }

    // Chat
    function startNewChat() {
        const t = prompt("Username:");
        if (t && t.toLowerCase() !== currentUser.username) {
            activeChat = t.toLowerCase();
            renderChats();
            renderMsgs();
        }
    }

    function renderChats() {
        const list = document.getElementById('chatList');
        list.innerHTML = '';
        const contacts = [...new Set(messages.filter(m => m.to === currentUser.username || m.from === currentUser.username).map(m => m.to === currentUser.username ? m.from : m.to))];
        if (activeChat && !contacts.includes(activeChat)) contacts.push(activeChat);
        contacts.forEach(c => {
            const item = document.createElement('div');
            item.className = 'chat-item' + (activeChat === c ? ' active' : '');
            item.onclick = () => { activeChat = c; renderMsgs(); renderChats(); };
            item.innerHTML = `<img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${c}" class="avatar"> <div><b>${c}</b><br><small style="color:gray">Tap to chat</small></div>`;
            list.appendChild(item);
        });
    }

    function renderMsgs() {
        if (!activeChat) return;
        document.getElementById('chatHeader').innerText = activeChat;
        const container = document.getElementById('chatMessages');
        container.innerHTML = '';
        messages.filter(m => (m.from === currentUser.username && m.to === activeChat) || (m.from === activeChat && m.to === currentUser.username))
        .forEach(m => {
            const d = document.createElement('div');
            d.className = `message ${m.from === currentUser.username ? 'sent' : 'received'}`;
            d.innerText = m.text;
            container.appendChild(d);
        });
        container.scrollTop = container.scrollHeight;
    }

    function sendMsg() {
        const i = document.getElementById('msgInput');
        if (!i.value || !activeChat) return;
        messages.push({ from: currentUser.username, to: activeChat, text: i.value });
        localStorage.setItem('cv_msgs', JSON.stringify(messages));
        i.value = '';
        renderMsgs();
    }

    // Emoji Grid
    const emojis = ['😀','😂','😍','😎','👍','🔥','✨','❤️','✔️','❌','👑','💀','😂','😭','😡','🤡'];
    const grid = document.getElementById('emojiGrid');
    emojis.forEach(e => {
        const s = document.createElement('span');
        s.innerText = e;
        s.onclick = () => { document.getElementById('msgInput').value += e; document.getElementById('picker').classList.remove('active'); };
        grid.appendChild(s);
    });
  </script>
</body>
</html>
