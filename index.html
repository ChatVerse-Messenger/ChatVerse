<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ChatVerse Messenger</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-main: #0b141a;
      --bg-sidebar: #111b21;
      --bg-header: #202c33;
      --bg-chat: #0b141a;
      --bg-input: #1d232a; /* Matched from screenshot */
      --accent-primary: #00a884;
      --text-main: #e9edef;
      --text-muted: #8696a0;
      --border-color: #222d34;
      --sidebar-width: 350px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { height: 100vh; background: var(--bg-main); color: var(--text-main); overflow: hidden; }

    /* --- RAINBOW ANIMATION --- */
    @keyframes rainbowText {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .rainbow-text {
      background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowText 3s linear infinite;
      font-weight: bold;
    }
    .owner-badge {
      background: linear-gradient(135deg, #00c89e, #005c4b);
      color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px;
      margin-left: 8px; font-weight: 800; text-transform: uppercase;
    }

    /* --- LAYOUT --- */
    #app { display: flex; height: 100vh; }

    /* --- SIDEBAR --- */
    .sidebar { width: var(--sidebar-width); background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-header); }
    
    /* NEW CHAT BUTTON (From Screenshot) */
    .new-chat-btn {
      background: var(--bg-input);
      color: white;
      border: 1px solid rgba(255,255,255,0.05);
      padding: 18px 20px;
      margin: 15px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
      transition: 0.2s;
    }
    .new-chat-btn:hover { background: #2a333c; }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 15px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .chat-item:hover { background: rgba(255,255,255,0.05); }

    .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #333; }

    /* --- PROFILE VIEW (From Screenshot) --- */
    .profile-view {
      position: fixed; inset: 0; background: #0f171e; z-index: 100;
      display: none; flex-direction: column;
    }
    .profile-view.active { display: flex; }
    .profile-header { padding: 20px; display: flex; align-items: center; gap: 20px; font-size: 18px; font-weight: bold; }
    
    .profile-content { 
      max-width: 400px; margin: 0 auto; width: 100%; padding: 20px; 
      display: flex; flex-direction: column; align-items: center;
    }

    .pfp-container { position: relative; margin-bottom: 20px; }
    .pfp-main { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #1d232a; }
    
    .profile-name-display { font-size: 22px; font-weight: bold; margin-bottom: 5px; display: flex; align-items: center; }
    .pfp-hint { color: var(--text-muted); font-size: 13px; margin-bottom: 30px; }

    .input-group { width: 100%; margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; color: var(--text-muted); font-size: 12px; margin-bottom: 8px; text-transform: uppercase; }
    .profile-input {
      width: 100%; background: var(--bg-input); border: 1px solid #2a333c;
      padding: 12px; border-radius: 8px; color: white; outline: none;
    }

    .save-btn {
      width: 100%; padding: 15px; background: #00a884; color: white;
      border: none; border-radius: 12px; font-weight: bold; font-size: 16px;
      cursor: pointer; margin-top: 10px;
    }

    /* --- MAIN CHAT --- */
    .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); }
    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 70%; padding: 10px 15px; border-radius: 10px; font-size: 14px; }
    .sent { align-self: flex-end; background: var(--accent-primary); color: white; }
    .received { align-self: flex-start; background: var(--bg-header); color: white; }
    
    .input-area { padding: 15px; background: var(--bg-header); display: flex; gap: 10px; }
    .chat-field { flex: 1; background: var(--bg-input); border: none; padding: 12px; border-radius: 8px; color: white; outline: none; }

    /* --- AUTH --- */
    .auth-screen { position: fixed; inset: 0; background: var(--bg-main); z-index: 200; display: flex; align-items: center; justify-content: center; }
    .auth-card { background: var(--bg-sidebar); padding: 40px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <h2 style="margin-bottom: 20px;">Welcome to ChatVerse</h2>
      <input type="text" id="loginUser" class="profile-input" style="margin-bottom: 10px;" placeholder="Username">
      <input type="password" id="loginPass" class="profile-input" style="margin-bottom: 20px;" placeholder="Password">
      <button class="save-btn" onclick="handleLogin()">Login / Sign Up</button>
      <p style="margin-top: 15px; font-size: 12px; color: gray;">Owner: owner | aynzoneloverisok</p>
    </div>
  </div>

  <div id="app">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <img id="myAvatarIcon" src="" class="avatar" onclick="toggleProfile(true)" style="cursor:pointer">
        <h3 id="myUsernameDisplay">ChatVerse</h3>
        <button onclick="location.reload()" style="background:none; border:none; color:white; cursor:pointer"><i class="fa-solid fa-power-off"></i></button>
      </div>

      <button class="new-chat-btn" onclick="startNewChat()">New Chat</button>

      <div class="chat-list" id="chatList">
        <!-- Chats appear here -->
      </div>
    </div>

    <!-- MAIN CHAT -->
    <div class="main-chat">
      <div id="chatHeader" style="padding: 15px; background: var(--bg-header); border-bottom: 1px solid var(--border-color); font-weight: bold;">
        Select a chat to start
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="input-area">
        <input type="text" id="msgInput" class="chat-field" placeholder="Type a message...">
        <button onclick="sendMsg()" class="save-btn" style="width: auto; padding: 10px 20px; margin: 0;">Send</button>
      </div>
    </div>
  </div>

  <!-- PROFILE VIEW -->
  <div id="profileView" class="profile-view">
    <div class="profile-header">
      <i class="fa-solid fa-arrow-left" onclick="toggleProfile(false)" style="cursor:pointer"></i>
      <span>My Profile</span>
    </div>
    
    <div class="profile-content">
      <div class="pfp-container">
        <img id="profilePfp" src="https://api.dicebear.com/7.x/avataaars/svg?seed=1" class="pfp-main" onclick="changePfp()">
      </div>
      
      <div class="profile-name-display">
        <span id="displayNameView">Name</span>
        <span id="badgeView" class="owner-badge">OWNER</span>
      </div>
      <div class="pfp-hint">Click PFP above to change image</div>

      <div class="input-group">
        <label>Display Name</label>
        <input type="text" id="editName" class="profile-input" oninput="syncPreview()">
      </div>

      <div class="input-group">
        <label>Custom Badge</label>
        <input type="text" id="editBadge" class="profile-input" oninput="syncPreview()">
      </div>

      <button class="save-btn" onclick="saveProfile()">Save Profile</button>
    </div>
  </div>

  <script>
    let currentUser = null;
    let users = JSON.parse(localStorage.getItem('cv_users')) || {};
    let messages = JSON.parse(localStorage.getItem('cv_msgs')) || [];
    let activeChat = null;

    // Login Logic
    function handleLogin() {
      const u = document.getElementById('loginUser').value.toLowerCase();
      const p = document.getElementById('loginPass').value;

      if(u === 'owner' && p === 'aynzoneloverisok') {
        if(!users[u]) {
          users[u] = { username: 'owner', name: 'AynzonePlayz[OWNER]', badge: 'OWNER', pfp: 'https://api.dicebear.com/7.x/bottts/svg?seed=vampire' };
        }
        currentUser = users[u];
      } else if (u && p) {
        if(!users[u]) users[u] = { username: u, name: u, badge: '', pfp: `https://api.dicebear.com/7.x/avataaars/svg?seed=${u}` };
        currentUser = users[u];
      }

      if(currentUser) {
        document.getElementById('authScreen').style.display = 'none';
        loadApp();
      }
    }

    function loadApp() {
      document.getElementById('myAvatarIcon').src = currentUser.pfp;
      document.getElementById('myUsernameDisplay').innerText = currentUser.name;
      renderChatList();
    }

    // Profile Logic
    function toggleProfile(show) {
      if(show) {
        document.getElementById('profilePfp').src = currentUser.pfp;
        document.getElementById('editName').value = currentUser.name;
        document.getElementById('editBadge').value = currentUser.badge;
        syncPreview();
        document.getElementById('profileView').classList.add('active');
      } else {
        document.getElementById('profileView').classList.remove('active');
      }
    }

    function syncPreview() {
      const name = document.getElementById('editName').value;
      const badge = document.getElementById('editBadge').value;
      const nameEl = document.getElementById('displayNameView');
      
      nameEl.innerText = name;
      if(currentUser.username === 'owner') nameEl.className = 'rainbow-text';
      
      const bView = document.getElementById('badgeView');
      bView.innerText = badge;
      bView.style.display = badge ? 'inline-block' : 'none';
    }

    function saveProfile() {
      currentUser.name = document.getElementById('editName').value;
      currentUser.badge = document.getElementById('editBadge').value;
      users[currentUser.username] = currentUser;
      localStorage.setItem('cv_users', JSON.stringify(users));
      loadApp();
      toggleProfile(false);
    }

    function changePfp() {
      const newUrl = prompt("Enter Image URL for PFP:");
      if(newUrl) {
        currentUser.pfp = newUrl;
        document.getElementById('profilePfp').src = newUrl;
      }
    }

    // Chat Logic
    function startNewChat() {
      const target = prompt("Enter username to chat with:").toLowerCase();
      if(target && target !== currentUser.username) {
        activeChat = target;
        renderChatList();
        renderMessages();
      }
    }

    function renderChatList() {
      const list = document.getElementById('chatList');
      list.innerHTML = '';
      
      // Get unique users we have talked to
      const contacts = [...new Set(messages.filter(m => m.to === currentUser.username || m.from === currentUser.username).map(m => m.to === currentUser.username ? m.from : m.to))];
      if(activeChat && !contacts.includes(activeChat)) contacts.push(activeChat);

      contacts.forEach(c => {
        const item = document.createElement('div');
        item.className = 'chat-item';
        item.onclick = () => { activeChat = c; renderMessages(); };
        item.innerHTML = `<img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${c}" class="avatar"> <div>${c}</div>`;
        list.appendChild(item);
      });
    }

    function renderMessages() {
      if(!activeChat) return;
      document.getElementById('chatHeader').innerText = "Chatting with: " + activeChat;
      const container = document.getElementById('chatMessages');
      container.innerHTML = '';
      
      messages.filter(m => (m.from === currentUser.username && m.to === activeChat) || (m.from === activeChat && m.to === currentUser.username))
      .forEach(m => {
        const div = document.createElement('div');
        div.className = `message ${m.from === currentUser.username ? 'sent' : 'received'}`;
        div.innerText = m.text;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    }

    function sendMsg() {
      const input = document.getElementById('msgInput');
      if(!input.value || !activeChat) return;

      messages.push({ from: currentUser.username, to: activeChat, text: input.value });
      localStorage.setItem('cv_msgs', JSON.stringify(messages));
      input.value = '';
      renderMessages();
    }
  </script>
</body>
</html>
