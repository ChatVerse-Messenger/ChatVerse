<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ChatVerse Messenger</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-main: #0b141a;
      --bg-sidebar: #111b21;
      --bg-header: #202c33;
      --bg-chat: #0b141a;
      --bg-input: #1d232a;
      --accent-primary: #00a884;
      --text-main: #e9edef;
      --text-muted: #8696a0;
      --border-color: #222d34;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { height: 100vh; background: var(--bg-main); color: var(--text-main); overflow: hidden; }

    /* --- RAINBOW OWNER --- */
    @keyframes rainbowText {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .rainbow-text {
      background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowText 3s linear infinite;
      font-weight: bold;
    }
    .owner-badge {
      background: linear-gradient(135deg, #00c89e, #005c4b);
      color: white; font-size: 10px; padding: 2px 8px; border-radius: 4px;
      margin-left: 8px; font-weight: 800; text-transform: uppercase;
    }

    /* --- AUTH SCREEN --- */
    .auth-screen { position: fixed; inset: 0; background: var(--bg-main); z-index: 2000; display: flex; align-items: center; justify-content: center; }
    .auth-card { background: var(--bg-sidebar); padding: 30px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .auth-logo { color: var(--accent-primary); font-size: 32px; font-weight: 800; margin-bottom: 5px; }
    
    .auth-tabs { display: flex; margin-bottom: 25px; background: var(--bg-input); border-radius: 10px; padding: 5px; }
    .auth-tab { flex: 1; padding: 10px; cursor: pointer; border-radius: 8px; font-weight: 600; color: var(--text-muted); transition: 0.2s; }
    .auth-tab.active { background: var(--accent-primary); color: white; }

    .input-group { text-align: left; width: 100%; margin-bottom: 15px; }
    .input-group label { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; font-weight: 700; }
    
    .profile-input { width: 100%; background: var(--bg-input); border: 1px solid #2a333c; padding: 12px; border-radius: 10px; color: white; outline: none; }
    .profile-input:focus { border-color: var(--accent-primary); }
    
    .save-btn { width: 100%; padding: 16px; background: var(--accent-primary); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }

    /* --- MODALS --- */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 3000; backdrop-filter: blur(4px); }
    .modal-overlay.active { display: flex; }
    .modal-card { background: var(--bg-sidebar); padding: 25px; border-radius: 20px; width: 90%; max-width: 380px; text-align: center; border: 1px solid var(--border-color); }

    /* --- SIDEBAR & CHAT --- */
    #app { display: flex; height: 100vh; }
    .sidebar { width: 350px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-header); }
    .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #333; }
    .new-chat-btn { background: var(--bg-input); color: white; border: 1px solid rgba(255,255,255,0.05); padding: 18px 20px; margin: 15px; border-radius: 12px; font-weight: 600; cursor: pointer; text-align: left; }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 15px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .chat-item.active { background: rgba(255,255,255,0.08); }

    .main-chat { flex: 1; display: flex; flex-direction: column; }
    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 70%; padding: 12px 16px; border-radius: 12px; font-size: 14px; }
    .sent { align-self: flex-end; background: var(--accent-primary); color: white; }
    .received { align-self: flex-start; background: var(--bg-header); color: white; }
    .input-area { padding: 15px; background: var(--bg-header); display: flex; gap: 12px; }
    .chat-field { flex: 1; background: var(--bg-input); border: none; padding: 14px; border-radius: 25px; color: white; outline: none; }

    /* --- PROFILE VIEW --- */
    .profile-view { position: fixed; inset: 0; background: #0f171e; z-index: 100; display: none; flex-direction: column; }
    .profile-view.active { display: flex; }
    .profile-header { padding: 20px; display: flex; align-items: center; gap: 20px; font-size: 18px; font-weight: bold; background: var(--bg-header); }
    .profile-content { max-width: 400px; margin: 0 auto; width: 100%; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }

    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">ChatVerse</div>
      
      <div class="auth-tabs">
        <div id="loginTab" class="auth-tab active" onclick="setAuthMode('login')">Login</div>
        <div id="signupTab" class="auth-tab" onclick="setAuthMode('signup')">Sign Up</div>
      </div>

      <div class="input-group">
        <label>Username</label>
        <input type="text" id="authUsername" class="profile-input" placeholder="Enter username">
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="authPassword" class="profile-input" placeholder="Enter password">
      </div>

      <!-- Signup Only Fields -->
      <div id="signupFields" class="hidden">
        <div class="input-group">
          <label>Display Name</label>
          <input type="text" id="authDisplayName" class="profile-input" placeholder="How others see you">
        </div>
        <div class="input-group">
            <label>Profile Picture URL</label>
            <input type="text" id="authPfpUrl" class="profile-input" placeholder="Paste image link">
          </div>
      </div>

      <button id="authBtn" class="save-btn" onclick="handleAuth()">Sign In</button>
      <p id="authMessage" style="margin-top:15px; font-size:12px; color:red;"></p>
    </div>
  </div>

  <!-- MODALS -->
  <div id="newChatModal" class="modal-overlay">
    <div class="modal-card">
      <h2>New Chat</h2>
      <input type="text" id="newChatUser" class="modal-input profile-input" placeholder="Enter username..." style="margin-top:15px;">
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="save-btn" style="background:#333;" onclick="closeModals()">Cancel</button>
        <button class="save-btn" onclick="confirmNewChat()">Start</button>
      </div>
    </div>
  </div>

  <div id="app">
    <div class="sidebar">
      <div class="sidebar-header">
        <img id="myAvatarIcon" src="" class="avatar" onclick="toggleProfile(true)" style="cursor:pointer">
        <span id="myUsernameDisplay" style="font-weight:700"></span>
        <i class="fa-solid fa-right-from-bracket" onclick="location.reload()" style="cursor:pointer; color:gray"></i>
      </div>
      <button class="new-chat-btn" onclick="openModal('newChatModal')">New Chat</button>
      <div class="chat-list" id="chatList"></div>
    </div>

    <div class="main-chat">
      <div id="chatHeader" style="padding:18px; background:var(--bg-header); font-weight:bold; border-bottom:1px solid var(--border-color)">Select a conversation</div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="input-area">
        <input type="text" id="msgInput" class="chat-field" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()" style="background:var(--accent-primary); border:none; width:45px; height:45px; border-radius:50%; color:white; cursor:pointer"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <!-- PROFILE VIEW -->
  <div id="profileView" class="profile-view">
    <div class="profile-header">
        <i class="fa-solid fa-arrow-left" onclick="toggleProfile(false)" style="cursor:pointer"></i>
        <span>My Profile</span>
    </div>
    <div class="profile-content">
        <img id="profilePfp" src="" class="profile-pfp avatar" style="width:130px; height:130px; border:4px solid var(--bg-input);">
        <div class="profile-name-display">
            <span id="displayNameView"></span>
            <span id="badgeView" class="owner-badge">OWNER</span>
        </div>
        <div class="input-group" style="margin-top:30px;">
            <label>Display Name</label>
            <input type="text" id="editName" class="profile-input" oninput="syncPreview()">
        </div>
        <div class="input-group">
            <label>PFP URL</label>
            <input type="text" id="editPfp" class="profile-input" oninput="syncPreview()">
        </div>
        <div class="input-group">
            <label>Badge</label>
            <input type="text" id="editBadge" class="profile-input" oninput="syncPreview()">
        </div>
        <button class="save-btn" onclick="saveProfile()">Save Changes</button>
    </div>
  </div>

  <script>
    const _KEY = "YXluem9uZWxvdmVyaXNraw==";
    let currentAuthMode = 'login';
    let currentUser = null;
    let users = JSON.parse(localStorage.getItem('cv_users')) || {};
    let messages = JSON.parse(localStorage.getItem('cv_msgs')) || [];
    let activeChat = null;

    function setAuthMode(mode) {
      currentAuthMode = mode;
      document.getElementById('loginTab').classList.toggle('active', mode === 'login');
      document.getElementById('signupTab').classList.toggle('active', mode === 'signup');
      document.getElementById('signupFields').classList.toggle('hidden', mode === 'login');
      document.getElementById('authBtn').innerText = mode === 'login' ? 'Sign In' : 'Create Account';
      document.getElementById('authMessage').innerText = '';
    }

    function handleAuth() {
      const u = document.getElementById('authUsername').value.trim().toLowerCase();
      const p = document.getElementById('authPassword').value;
      const msg = document.getElementById('authMessage');

      if (!u || !p) { msg.innerText = "Fields cannot be empty"; return; }

      if (currentAuthMode === 'login') {
        // Owner Check
        if (u === 'owner' && btoa(p) === _KEY) {
          if (!users[u]) users[u] = { username: 'owner', name: 'AynzonePlayz[OWNER]', badge: 'OWNER', pfp: 'https://api.dicebear.com/7.x/bottts/svg?seed=vampire' };
          currentUser = users[u];
        } 
        // Regular User Check
        else if (users[u] && users[u].password === p) {
          currentUser = users[u];
        } else {
          msg.innerText = "Invalid username or password";
          return;
        }
      } else {
        // Sign Up Logic
        if (users[u]) { msg.innerText = "Username already exists"; return; }
        const dn = document.getElementById('authDisplayName').value.trim() || u;
        const pfp = document.getElementById('authPfpUrl').value.trim() || `https://api.dicebear.com/7.x/avataaars/svg?seed=${u}`;
        
        users[u] = { username: u, password: p, name: dn, badge: '', pfp: pfp };
        localStorage.setItem('cv_users', JSON.stringify(users));
        currentUser = users[u];
      }

      document.getElementById('authScreen').style.display = 'none';
      loadApp();
    }

    function loadApp() {
      document.getElementById('myAvatarIcon').src = currentUser.pfp;
      const n = document.getElementById('myUsernameDisplay');
      n.innerText = currentUser.name;
      n.className = currentUser.username === 'owner' ? 'rainbow-text' : '';
      renderChatList();
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); }

    function confirmNewChat() {
      const target = document.getElementById('newChatUser').value.toLowerCase();
      if(target && target !== currentUser.username) {
        activeChat = target;
        closeModals();
        renderChatList();
        renderMessages();
      }
    }

    function toggleProfile(show) {
      if(show) {
        document.getElementById('profilePfp').src = currentUser.pfp;
        document.getElementById('editName').value = currentUser.name;
        document.getElementById('editPfp').value = currentUser.pfp;
        document.getElementById('editBadge').value = currentUser.badge;
        syncPreview();
        document.getElementById('profileView').classList.add('active');
      } else { document.getElementById('profileView').classList.remove('active'); }
    }

    function syncPreview() {
      const name = document.getElementById('editName').value;
      const badge = document.getElementById('editBadge').value;
      const pfp = document.getElementById('editPfp').value;
      
      document.getElementById('displayNameView').innerText = name || currentUser.username;
      document.getElementById('profilePfp').src = pfp || currentUser.pfp;
      
      const b = document.getElementById('badgeView');
      b.innerText = badge;
      b.style.display = badge ? 'inline-block' : 'none';
    }

    function saveProfile() {
      currentUser.name = document.getElementById('editName').value;
      currentUser.pfp = document.getElementById('editPfp').value;
      currentUser.badge = document.getElementById('editBadge').value;
      users[currentUser.username] = currentUser;
      localStorage.setItem('cv_users', JSON.stringify(users));
      loadApp();
      toggleProfile(false);
    }

    function renderChatList() {
      const list = document.getElementById('chatList');
      list.innerHTML = '';
      const contacts = [...new Set(messages.filter(m => m.to === currentUser.username || m.from === currentUser.username).map(m => m.to === currentUser.username ? m.from : m.to))];
      if(activeChat && !contacts.includes(activeChat)) contacts.push(activeChat);
      contacts.forEach(c => {
        const item = document.createElement('div');
        item.className = 'chat-item' + (activeChat === c ? ' active' : '');
        item.onclick = () => { activeChat = c; renderMessages(); renderChatList(); };
        item.innerHTML = `<img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${c}" class="avatar"> <div><div style="font-weight:bold">${c}</div><div style="font-size:12px; color:gray">Online</div></div>`;
        list.appendChild(item);
      });
    }

    function renderMessages() {
      if(!activeChat) return;
      document.getElementById('chatHeader').innerText = activeChat;
      const container = document.getElementById('chatMessages');
      container.innerHTML = '';
      messages.filter(m => (m.from === currentUser.username && m.to === activeChat) || (m.from === activeChat && m.to === currentUser.username))
      .forEach(m => {
        const div = document.createElement('div');
        div.className = `message ${m.from === currentUser.username ? 'sent' : 'received'}`;
        div.innerText = m.text;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    }

    function sendMsg() {
      const input = document.getElementById('msgInput');
      if(!input.value || !activeChat) return;
      messages.push({ from: currentUser.username, to: activeChat, text: input.value });
      localStorage.setItem('cv_msgs', JSON.stringify(messages));
      input.value = '';
      renderMessages();
    }
  </script>
</body>
</html>
