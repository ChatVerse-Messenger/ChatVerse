<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChatVerse - Owner Deluxe Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-dark: #0b141a;
            --bg-panel: #111b21;
            --bg-chat: #0b141a;
            --bg-msg-out: #005c4b;
            --bg-msg-in: #202c33;
            --bg-hover: #202c33;
            --bg-active: #2a3942;
            --header-bg: #1f2c34;
            --search-bg: #202c33;
            --input-bg: #2a3942;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --text-accent: #00a884;
            --border-color: #222d34;
            --green: #00a884;
            --green-dark: #008069;
            --blue: #53bdeb;
            --red: #ea4335;
            --purple: #7c3aed;
            --pink: #ec4899;
            --gold: #f59e0b;
            --online: #31c75a;
            --scrollbar: #374045;
            --sidebar-width: 370px;
        }

        body { font-family: 'Inter', -apple-system, sans-serif; background: #000; color: var(--text-primary); height: 100vh; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

        /* ====== ANIMATED RAINBOW OWNER RANK ====== */
        .rainbow-text {
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowMove 3s linear infinite;
            font-weight: 900 !important;
            display: inline-block;
        }

        @keyframes rainbowMove {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .owner-badge {
            background: linear-gradient(135deg, #ff007f, #7928ca, #ff0000);
            color: #ffffff !important;
            font-size: 0.65rem;
            padding: 2px 7px;
            border-radius: 6px;
            font-weight: 900;
            letter-spacing: 0.5px;
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.6);
            display: inline-block;
            vertical-align: middle;
            margin-left: 4px;
            text-shadow: none;
        }

        /* ====== AUTH ====== */
        .auth-overlay { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-overlay.hidden { display: none; }
        .auth-container { width: 440px; max-width: 95vw; background: var(--bg-panel); border-radius: 16px; padding: 36px; border: 1px solid var(--border-color); max-height: 95vh; overflow-y: auto; }
        
        .auth-logo { text-align: center; margin-bottom: 28px; }
        .auth-logo .logo-icon { width: 70px; height: 70px; background: var(--green); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 34px; margin: 0 auto 12px; box-shadow: 0 8px 30px rgba(0,168,132,0.3); }
        .auth-logo h1 { font-size: 2rem; font-weight: 900; background: linear-gradient(135deg, var(--green), var(--blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .auth-logo p { color: var(--text-secondary); font-size: 0.88rem; margin-top: 4px; }
        .auth-tabs { display: flex; margin-bottom: 22px; background: var(--bg-dark); border-radius: 10px; padding: 4px; }
        .auth-tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--text-secondary); transition: all .2s; }
        .auth-tab.active { background: var(--green); color: white; }
        .auth-form { display: none; } .auth-form.active { display: block; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 11px 14px; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 0.92rem; outline: none; transition: border-color .2s; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--green); }
        .form-group textarea { resize: none; height: 65px; }

        .avatar-picker { display: flex; align-items: center; gap: 12px; }
        .avatar-preview {
            width: 60px; height: 60px; border-radius: 50%; background: var(--bg-dark);
            display: flex; align-items: center; justify-content: center; font-size: 26px;
            border: 2px solid var(--border-color); flex-shrink: 0; cursor: pointer;
            background-size: cover; background-position: center; position: relative;
        }
        .avatar-preview:hover::after { content: '📷'; position: absolute; background: rgba(0,0,0,0.6); width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .avatar-emojis { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
        .avatar-emoji-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-dark); font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
        .avatar-emoji-btn:hover, .avatar-emoji-btn.selected { border-color: var(--green); background: rgba(0,168,132,0.1); }

        .auth-btn { width: 100%; padding: 13px; background: var(--green); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; transition: background .2s; margin-top: 6px; }
        .auth-btn:hover { background: var(--green-dark); }
        .auth-error { color: var(--red); font-size: 0.8rem; margin-top: 6px; min-height: 18px; }

        /* ====== MAIN LAYOUT & RESIZER ====== */
        .app-container { display: flex; height: 100vh; width: 100%; }
        
        .sidebar {
            width: var(--sidebar-width); min-width: 260px; max-width: 60vw;
            background: var(--bg-panel); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; height: 100vh; position: relative;
        }
        
        .sidebar-resizer {
            position: absolute; top: 0; right: -4px; width: 8px; height: 100%;
            cursor: col-resize; background: transparent; z-index: 100; transition: background 0.2s;
        }
        .sidebar-resizer:hover, .sidebar-resizer.active { background: var(--green); }

        /* ====== SIDEBAR HEADER & LOGOUT BUTTON FIX ====== */
        .sidebar-header {
            padding: 10px 14px; background: var(--header-bg);
            display: flex; align-items: center; justify-content: space-between;
            min-height: 60px; gap: 8px;
        }
        .sidebar-header .user-info {
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            flex: 1; min-width: 0; /* Critical to prevent pushing buttons out */
        }
        .sidebar-header .user-name-wrapper {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            font-weight: 600; font-size: 0.92rem; flex: 1;
        }

        .header-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .header-btn {
            width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent;
            color: var(--text-secondary); font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: background .2s;
        }
        .header-btn:hover { background: var(--bg-hover); color: var(--text-primary); }

        .search-bar { padding: 7px 12px; background: var(--bg-panel); }
        .search-input-wrap { display: flex; align-items: center; background: var(--search-bg); border-radius: 8px; padding: 0 12px; }
        .search-input-wrap .search-icon { color: var(--text-secondary); margin-right: 8px; font-size: 14px; }
        .search-input-wrap input { flex: 1; padding: 8px 0; background: transparent; border: none; color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 0.88rem; outline: none; }
        
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-list-item { display: flex; align-items: center; padding: 11px 14px; cursor: pointer; transition: background .12s; border-bottom: 1px solid rgba(134,150,160,0.06); position: relative; }
        .chat-list-item:hover { background: var(--bg-hover); }
        .chat-list-item.active { background: var(--bg-active); }

        .chat-avatar {
            width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 22px; flex-shrink: 0; margin-right: 12px;
            position: relative; background-size: cover; background-position: center;
        }
        
        .chat-list-info { flex: 1; min-width: 0; }
        .chat-list-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .chat-list-name { font-weight: 600; font-size: 0.93rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
        .name-badge { font-size: 0.52rem; padding: 2px 5px; border-radius: 4px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: white; }
        .chat-list-preview { font-size: 0.83rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .unread-badge { min-width: 20px; height: 20px; border-radius: 10px; background: var(--green); color: white; font-size: 0.68rem; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px; position: absolute; right: 14px; bottom: 12px; }

        /* ====== CHAT AREA ====== */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); position: relative; }
        .chat-bg-pattern { position: absolute; inset: 0; opacity: .025; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
        .no-chat-selected { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 1; }
        .no-chat-selected .icon { font-size: 72px; margin-bottom: 16px; opacity: .4; }
        .no-chat-selected h2 { font-size: 1.7rem; font-weight: 300; margin-bottom: 8px; }
        
        .chat-header { padding: 10px 14px; background: var(--header-bg); display: flex; align-items: center; gap: 12px; min-height: 60px; z-index: 2; }
        .chat-header .back-mobile { display: none; font-size: 20px; background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 6px; }
        .chat-header-info { flex: 1; cursor: pointer; }
        .chat-header-name { font-weight: 600; font-size: 1rem; display: flex; align-items: center; gap: 6px; }

        .messages-container { flex: 1; overflow-y: auto; padding: 16px 30px; display: flex; flex-direction: column; z-index: 1; }
        .message { display: flex; margin-bottom: 3px; }
        .message.sent { justify-content: flex-end; }
        .message.received { justify-content: flex-start; }
        .msg-bubble { max-width: 65%; padding: 7px 10px 8px; border-radius: 8px; position: relative; min-width: 80px; word-wrap: break-word; }
        .message.sent .msg-bubble { background: var(--bg-msg-out); border-top-right-radius: 0; }
        .message.received .msg-bubble { background: var(--bg-msg-in); border-top-left-radius: 0; }
        
        .msg-text { font-size: .88rem; line-height: 1.4; white-space: pre-wrap; }
        .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 2px; }
        .msg-time { font-size: .66rem; color: rgba(255,255,255,.45); }
        .msg-status.read { color: var(--blue); }
        .msg-image { max-width: 280px; max-height: 300px; border-radius: 6px; cursor: pointer; display: block; }
        
        /* Input Area */
        .chat-input-area { padding: 8px 12px; display: flex; align-items: flex-end; gap: 8px; z-index: 2; background: var(--bg-panel); }
        .input-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: transparent; color: var(--text-secondary); font-size: 19px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color .15s; flex-shrink: 0; }
        .input-btn:hover { color: var(--text-primary); }
        
        .msg-input-wrap { flex: 1; background: var(--input-bg); border-radius: 8px; display: flex; align-items: flex-end; padding: 2px 10px; }
        .msg-input { flex: 1; padding: 9px 0; background: transparent; border: none; color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: .92rem; outline: none; resize: none; max-height: 110px; line-height: 1.4; }
        .send-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--green); color: white; font-size: 19px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; flex-shrink: 0; }
        .send-btn:hover { background: var(--green-dark); }

        /* ====== EMOJI / GIF PICKER ====== */
        .picker-container {
            display: none; position: absolute; bottom: 66px; left: 14px; width: 340px; height: 400px;
            background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px;
            z-index: 100; flex-direction: column; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.4);
        }
        .picker-container.show { display: flex; }
        .picker-tabs { display: flex; background: var(--bg-dark); }
        .picker-tab { flex: 1; padding: 8px; text-align: center; cursor: pointer; font-weight: 600; font-size: 0.9rem; border-bottom: 2px solid transparent; color: var(--text-secondary); }
        .picker-tab.active { border-bottom-color: var(--green); color: var(--green); }
        
        .emoji-grid, .gif-grid { flex: 1; overflow-y: auto; padding: 6px; gap: 2px; align-content: start; }
        .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); }
        .gif-grid { display: none; grid-template-columns: repeat(2, 1fr); gap: 4px; }
        .gif-grid.show { display: grid; }
        .emoji-grid.show { display: grid; }
        
        .emoji-item { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; border-radius: 6px; transition: background .1s; }
        .emoji-item:hover { background: var(--bg-hover); }
        .gif-item { width: 100%; height: 100px; background-size: cover; background-position: center; border-radius: 8px; cursor: pointer; }

        /* ====== PROFILE PANEL ====== */
        .profile-panel {
            display: none; position: fixed; top: 0; right: 0; width: 380px; max-width: 100vw;
            height: 100vh; background: var(--bg-panel); border-left: 1px solid var(--border-color);
            z-index: 500; flex-direction: column; animation: slideInRight .25s ease; overflow-y: auto;
        }
        .profile-panel.show { display: flex; }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .profile-panel-header { padding: 14px; background: var(--header-bg); display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 2; }
        .profile-panel-header button { background: none; border: none; color: var(--text-primary); font-size: 20px; cursor: pointer; }
        
        .profile-banner { height: 140px; display: flex; align-items: center; justify-content: center; position: relative; }
        .profile-avatar-large {
            width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 42px; position: absolute; bottom: -40px;
            border: 4px solid var(--bg-panel); background-size: cover; background-position: center;
        }
        .profile-avatar-large.editable:hover::after { content: '📷'; position: absolute; background: rgba(0,0,0,0.6); width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; }
        
        .profile-details { padding: 48px 20px 16px; text-align: center; }
        .profile-display-name { font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .profile-section { padding: 14px 20px; border-top: 6px solid var(--bg-dark); }
        
        .toast { position: fixed; top: 16px; right: 16px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 18px; z-index: 9000; display: none; animation: slideIn .3s ease; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
        .toast.show { display: flex; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        @media(max-width: 768px) {
            .sidebar { width: 100% !important; min-width: 100% !important; }
            .sidebar-resizer { display: none; }
            .chat-area { position: fixed; inset: 0; display: none; z-index: 200; }
            .chat-area.mobile-show { display: flex; }
            .chat-header .back-mobile { display: block; }
            .picker-container { width: 290px; left: 8px; }
        }
    </style>
</head>
<body>

<!-- Hidden File Upload Inputs -->
<input type="file" id="pfpUpload" accept="image/*" style="display:none" onchange="handlePfpUpload(event, 'signup')">
<input type="file" id="profilePfpUpload" accept="image/*" style="display:none" onchange="handlePfpUpload(event, 'profile')">
<input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">

<!-- LOGIN / SIGNUP OVERLAY -->
<div class="auth-overlay" id="authOverlay">
    <div class="auth-container">
        <div class="auth-logo">
            <div class="logo-icon">💬</div>
            <h1>ChatVerse</h1>
            <p>Deluxe Edition</p>
        </div>
        <div class="auth-tabs">
            <div class="auth-tab active" onclick="switchAuthTab('login')">Login</div>
            <div class="auth-tab" onclick="switchAuthTab('signup')">Sign Up</div>
        </div>

        <div class="auth-form active" id="loginForm">
            <div class="form-group"><input type="text" id="loginUsername" placeholder="Username"></div>
            <div class="form-group"><input type="password" id="loginPassword" placeholder="Password" onkeydown="if(event.key==='Enter')handleLogin()"></div>
            <div class="auth-error" id="loginError"></div>
            <button class="auth-btn" onclick="handleLogin()">Login</button>
        </div>

        <div class="auth-form" id="signupForm">
            <div class="form-group"><input type="text" id="signupDisplayName" placeholder="Display Name"></div>
            <div class="form-group"><input type="text" id="signupUsername" placeholder="Username (no spaces)" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9_]/g,'')"></div>
            <div class="form-group"><input type="password" id="signupPassword" placeholder="Password (Min 4)"></div>
            <div class="form-group">
                <label>Profile Picture (Click Avatar to Upload Image or Select Emoji)</label>
                <div class="avatar-picker">
                    <div class="avatar-preview" id="avatarPreview" onclick="document.getElementById('pfpUpload').click()">😀</div>
                    <div class="avatar-emojis" id="avatarEmojis"></div>
                </div>
            </div>
            <div class="auth-error" id="signupError"></div>
            <button class="auth-btn" onclick="handleSignup()">Create Account</button>
        </div>
    </div>
</div>

<!-- MAIN APP CONTAINER -->
<div class="app-container" id="appContainer" style="display:none">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <!-- DRAGGABLE SPLIT RESIZER -->
        <div class="sidebar-resizer" id="sidebarResizer"></div>

        <div class="sidebar-header">
            <div class="user-info" onclick="openMyProfile()">
                <div class="chat-avatar" id="sidebarAvatar" style="width:38px;height:38px;font-size:18px"></div>
                <div class="user-name-wrapper" id="sidebarName"></div>
            </div>
            <!-- FIXED HEADER ACTIONS (LOGOUT BUTTON ALWAYS VISIBLE) -->
            <div class="header-actions">
                <button class="header-btn" onclick="openNewChat()" title="Start New Chat">💬</button>
                <button class="header-btn" onclick="openMyProfile()" title="Settings / Profile">⚙️</button>
                <button class="header-btn" onclick="handleLogout()" title="Logout" style="color:var(--red)">🚪</button>
            </div>
        </div>

        <div class="search-bar">
            <div class="search-input-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="Search chats..." id="searchInput" oninput="renderChatList()">
            </div>
        </div>
        
        <div class="chat-list" id="chatList"></div>
    </div>

    <!-- MAIN CHAT AREA -->
    <div class="chat-area" id="chatArea">
        <div class="chat-bg-pattern"></div>
        <div class="no-chat-selected" id="noChatView">
            <div class="icon">💬</div>
            <h2>ChatVerse</h2>
            <p>Select a user to start messaging.</p>
        </div>

        <div id="activeChatView" style="display:none;flex-direction:column;height:100%;z-index:1">
            <div class="chat-header">
                <button class="back-mobile" onclick="closeMobileChat()">←</button>
                <div class="chat-avatar" id="chatHeaderAvatar"></div>
                <div class="chat-header-info" onclick="openContactProfile()">
                    <div class="chat-header-name" id="chatHeaderName"></div>
                </div>
                <div class="header-actions">
                    <button class="header-btn" onclick="clearChat()" title="Clear Chat History">🧹</button>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer"></div>
            
            <!-- EMOJI / GIF PICKER -->
            <div class="picker-container" id="pickerContainer">
                <div class="picker-tabs">
                    <div class="picker-tab active" onclick="switchPicker('emoji')" id="tabEmoji">Emojis</div>
                    <div class="picker-tab" onclick="switchPicker('gif')" id="tabGif">GIFs</div>
                </div>
                <div class="emoji-grid show" id="emojiGrid"></div>
                <div class="gif-grid" id="gifGrid"></div>
            </div>

            <!-- CHAT INPUT AREA -->
            <div class="chat-input-area">
                <button class="input-btn" onclick="togglePicker()">😊</button>
                <button class="input-btn" onclick="document.getElementById('imageInput').click()">📷</button>
                <div class="msg-input-wrap">
                    <textarea class="msg-input" id="msgInput" placeholder="Type a message..." rows="1" onkeydown="handleInputKey(event)"></textarea>
                </div>
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
</div>

<!-- PROFILE SLIDE-OUT PANEL -->
<div class="profile-panel" id="profilePanel">
    <div class="profile-panel-header">
        <button onclick="closeProfilePanel()">←</button>
        <h3 id="profilePanelTitle">Profile</h3>
    </div>
    <div id="profilePanelContent"></div>
</div>

<!-- NEW CHAT MODAL -->

<script>
// =============================================================================
// STORAGE ENGINE (REAL-TIME BROADCAST SYNC)
// =============================================================================
const DB = {
    get(k) { try { return JSON.parse(localStorage.getItem('cv_' + k)) || null } catch { return null } },
    set(k, v) { localStorage.setItem('cv_' + k, JSON.stringify(v)); channel.postMessage({ type: 'update', key: k }) },
};

const channel = new BroadcastChannel('chatverse_sync');
channel.onmessage = (e) => {
    if (e.data.type === 'update') {
        if (e.data.key === 'messages') {
            if (activeChat) {
                markAsRead(); // Auto-read unread messages when active
                renderMessages();
            }
            renderChatList();
        }
        if (e.data.key === 'users') {
            renderChatList();
            updateSidebar();
        }

};

setInterval(() => { if (currentUser) renderChatList(); }, 3000);

// =============================================================================
// CONSTANTS & OWNER SEED
// =============================================================================
const avatarEmojis = ["😀","😎","🤓","🥳","😇","🤠","🧑‍💻","👨‍🎨","🦸","🐱","🐶","🦊","💀","👑"];

const emojisList = ["😀","😃","😄","😁","😆","😅","🤣","😂","🙂","🙃","😉","😊","😇","🥰","😍","🤩","😘","😗","😚","😙","🥲","😋","😛","😜","🤪","😝","🤑","🤗","🤭","🤫","🤔","🤐","🤨","😐","😑","😶","😏","😒","🙄","😬","😌","😔","😪","🤤","😴","😷","🤒","🤕","🤢","🤮","🥵","🥶","🥴","😵","🤯","🤠","🥳","🥸","😎","🤓","🧐","😕","😟","🙁","😮","😯","😲","😳","🥺","🥹","😦","😧","😨","😰","😥","😢","😭","😱","😖","😣","😞","😓","😩","😫","🥱","😤","😡","😠","🤬","😈","👿","💀","☠️","💩","🤡","👹","👺","👻","👽","👾","🤖","👋","👍","👎","👏","🙌","🫶","🤝","🙏","💪","❤️","🔥","✨","⭐","🌟","🎉","🎊","🎈","⚽","🏀","🏈","⚾","🎾","🚗","🚕","🚙","🍎","🍔","🍕","🍟","🏳️‍🌈","🏳️‍⚧️","🇺🇸","🇬🇧","🇫🇷","🇩🇪","🇮🇹","🇪🇸","🇯🇵","🇰🇷","🇨🇳","🇮🇳","🇧🇷","🇨🇦","🇦🇺","🇲🇽","🇷🇺","🇿🇦"];

const gifList = [
    "https://media.giphy.com/media/l0HlOBZcl7sbV6LnO/giphy.gif",
    "https://media.giphy.com/media/3o7TKSjRrfIPjeiVyM/giphy.gif",
    "https://media.giphy.com/media/26FPJGjhefSJuaRhu/giphy.gif",
    "https://media.giphy.com/media/xT0xezQGU5xCDJuCPe/giphy.gif",
    "https://media.giphy.com/media/5GoVLqeAOo6PK/giphy.gif",
    "https://media.giphy.com/media/3o7aD2saalEvpjtce4/giphy.gif",

];

function seedOwner() {
    let users = DB.get('users') || {};
    users['owner'] = {
        username: 'owner',
        displayName: 'AynzonePlayz',
        password: 'aynzoneloverisok',
        bio: '👑 Official Owner of ChatVerse',
        avatar: '👑', 
        banner: '#1f2c34',
        role: 'owner',
        createdAt: Date.now()
    };
    DB.set('users', users);

// =============================================================================
// SIDEBAR DRAG-TO-RESIZE
// =============================================================================
let isResizing = false;
const sidebar = document.getElementById('sidebar');
const resizer = document.getElementById('sidebarResizer');

resizer.addEventListener('mousedown', (e) => {
    isResizing = true;
    resizer.classList.add('active');
    document.body.style.cursor = 'col-resize';
});

document.addEventListener('mousemove', (e) => {
    if (!isResizing) return;
    let newWidth = e.clientX;
    if (newWidth < 260) newWidth = 260;
    if (newWidth > window.innerWidth * 0.6) newWidth = window.innerWidth * 0.6;
    document.documentElement.style.setProperty('--sidebar-width', newWidth + 'px');
});

document.addEventListener('mouseup', () => {
    if (isResizing) {
        isResizing = false;
        resizer.classList.remove('active');
        document.body.style.cursor = '';
    }
});

// =============================================================================
// APP STATE & RENDERING HELPERS
// =============================================================================
let currentUser = null;
let activeChat = null; 
let tempProfileAvatar = null;

function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 8); }
function getChatId(u1, u2) { return [u1, u2].sort().join('__'); }

function renderAvatarStyle(user) {
    if (!user || !user.avatar) return '';
    if (user.avatar.startsWith('data:image')) return `background-image: url(${user.avatar}); background-size: cover; background-position: center;`;
    return '';
}

function renderAvatarInner(user) {
    if (!user || !user.avatar) return '😀';
    if (user.avatar.startsWith('data:image')) return '';
    return user.avatar;
}

// GUARANTEED RAINBOW OWNER RANK RENDERER
function renderNameWithRole(user) {
    if (!user) return '';
    const isOwner = user.username === 'owner' || user.role === 'owner';
    if (isOwner) {
        return `<span class="rainbow-text">${escapeHtml(user.displayName)}</span><span class="owner-badge">👑 OWNER</span>`;
    }
    let html = `<span>${escapeHtml(user.displayName)}</span>`;
    if (user.badge) {
        html += ` <span class="name-badge" style="background:${user.badgeColor || '#00a884'}">${escapeHtml(user.badge)}</span>`;
    }
    return html;
}

// =============================================================================
// AUTH & PFP UPLOAD
// =============================================================================
function switchAuthTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t, i) => t.classList.toggle('active', (tab==='login' ? i===0 : i===1)));
    document.getElementById('loginForm').classList.toggle('active', tab==='login');
    document.getElementById('signupForm').classList.toggle('active', tab==='signup');
}

function handlePfpUpload(e, context) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX = 180;
            let w = img.width, h = img.height;
            if (w > MAX || h > MAX) { const r = Math.min(MAX/w, MAX/h); w*=r; h*=r; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.75);

            if (context === 'signup') {
                const prev = document.getElementById('avatarPreview');
                prev.textContent = '';
                prev.style.backgroundImage = `url(${dataUrl})`;
                prev.dataset.b64 = dataUrl;
            } else if (context === 'profile') {
                tempProfileAvatar = dataUrl;
                const p = document.getElementById('profAvatarLg');
                p.textContent = '';
                p.style.backgroundImage = `url(${dataUrl})`;
            }
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
}

function handleLogin() {
    const u = document.getElementById('loginUsername').value.trim().toLowerCase();
    const p = document.getElementById('loginPassword').value;
    const err = document.getElementById('loginError');
    const users = DB.get('users') || {};
    
    if (!u || !p) { err.textContent = 'Please enter username and password'; return; }
    if (!users[u] || users[u].password !== p) { err.textContent = 'Incorrect username or password'; return; }
    
    err.textContent = '';
    currentUser = users[u];
    localStorage.setItem('cv_session', u);
    enterApp();
}

function handleSignup() {
    const d = document.getElementById('signupDisplayName').value.trim();
    const u = document.getElementById('signupUsername').value.trim().toLowerCase();
    const p = document.getElementById('signupPassword').value;
    const prev = document.getElementById('avatarPreview');
    const avatar = prev.dataset.b64 || prev.textContent.trim() || '😀';
    const err = document.getElementById('signupError');

    if (!d || !u || !p) { err.textContent = 'Please fill out all fields'; return; }
    const users = DB.get('users') || {};
    if (users[u]) { err.textContent = 'Username is already taken'; return; }

    users[u] = {
        username: u, displayName: d, password: p, avatar: avatar,
        banner: '#1e293b', badge: '', role: 'user', createdAt: Date.now()
    };
    DB.set('users', users);
    currentUser = users[u];
    localStorage.setItem('cv_session', u);
    enterApp();
}

function handleLogout() {
    localStorage.removeItem('cv_session');
    currentUser = null; activeChat = null;
    document.getElementById('appContainer').style.display = 'none';
    document.getElementById('authOverlay').classList.remove('hidden');
}

function enterApp() {
    document.getElementById('authOverlay').classList.add('hidden');
    document.getElementById('appContainer').style.display = 'flex';
    updateSidebar();
    renderChatList();
}

function updateSidebar() {
    if (!currentUser) return;
    const av = document.getElementById('sidebarAvatar');
    av.style = renderAvatarStyle(currentUser);
    av.innerHTML = renderAvatarInner(currentUser);
    document.getElementById('sidebarName').innerHTML = renderNameWithRole(currentUser);
}

// =============================================================================
// CHAT LIST & UNREAD FIX
// =============================================================================
function renderChatList() {
    if (!currentUser) return;
    const messages = DB.get('messages') || {};
    const users = DB.get('users') || {};
    const search = document.getElementById('searchInput').value.toLowerCase();
    
    let chatItems = [];
    Object.keys(messages).forEach(chatId => {
        const parts = chatId.split('__');
        if (!parts.includes(currentUser.username)) return;
        const other = parts.find(p => p !== currentUser.username);
        if (!other || !users[other]) return;
        if (search && !users[other].displayName.toLowerCase().includes(search) && !other.includes(search)) return;
        
        const msgs = messages[chatId] || [];
        const lastMsg = msgs[msgs.length - 1];
        // Clean Unread count check
        const unread = msgs.filter(m => m.from !== currentUser.username && m.status !== 'read').length;
        chatItems.push({ id: other, user: users[other], lastMsg, unread, time: lastMsg?.time || 0 });
    });

    chatItems.sort((a, b) => b.time - a.time);
    const list = document.getElementById('chatList');
    
    if (chatItems.length === 0) {
        list.innerHTML = `<div style="text-align:center;padding:50px 18px;color:var(--text-secondary)">No conversations yet.<br>Click 💬 to chat!</div>`;
        return;
    }

    list.innerHTML = chatItems.map(c => {
        let preview = '';
        if (c.lastMsg) {
            if (c.lastMsg.gif) preview = '🎬 GIF';
            else if (c.lastMsg.image) preview = '📷 Image';
            else preview = (c.lastMsg.from === currentUser.username ? '✓ ' : '') + c.lastMsg.text.substring(0, 35);
        }
        return `<div class="chat-list-item ${activeChat === c.id ? 'active' : ''}" onclick="openChat('${c.id}')">
            <div class="chat-avatar" style="${renderAvatarStyle(c.user)}; background-color:${c.user.banner || '#1e293b'}">
                ${renderAvatarInner(c.user)}
            </div>
            <div class="chat-list-info">
                <div class="chat-list-top"><div class="chat-list-name">${renderNameWithRole(c.user)}</div></div>
                <div class="chat-list-preview" style="${c.unread > 0 ? 'color:var(--text-primary);font-weight:700' : ''}">${preview}</div>
            </div>
            ${c.unread > 0 ? `<div class="unread-badge">${c.unread}</div>` : ''}
        </div>`;
    }).join('');
}

// =============================================================================
// CHAT & MESSAGING
// =============================================================================
function openChat(id) {
    activeChat = id;
    const user = (DB.get('users') || {})[id];
    if (!user) return;

    document.getElementById('noChatView').style.display = 'none';
    document.getElementById('activeChatView').style.display = 'flex';
    
    const hAv = document.getElementById('chatHeaderAvatar');
    hAv.style = renderAvatarStyle(user) + `;background-color:${user.banner || '#1e293b'}`;
    hAv.innerHTML = renderAvatarInner(user);
    document.getElementById('chatHeaderName').innerHTML = renderNameWithRole(user);
    
    markAsRead();
    renderMessages();
    renderChatList();
    document.getElementById('chatArea').classList.add('mobile-show');
}

function closeMobileChat() { 
    document.getElementById('chatArea').classList.remove('mobile-show'); 
    activeChat = null; 
}

function markAsRead() {
    if (!activeChat) return;
    const key = getChatId(currentUser.username, activeChat);
    let messages = DB.get('messages') || {};
    if (!messages[key]) return;
    let changed = false;
    messages[key] = messages[key].map(m => {
        if (m.from !== currentUser.username && m.status !== 'read') {
            m.status = 'read'; changed = true;
        }
        return m;
    });
    if (changed) DB.set('messages', messages);
}

function renderMessages() {
    if (!activeChat) return;
    const key = getChatId(currentUser.username, activeChat);
    const msgs = (DB.get('messages') || {})[key] || [];
    const container = document.getElementById('messagesContainer');
    
    let html = '';
    msgs.forEach(msg => {
        const isSent = msg.from === currentUser.username;
        let content = '';
        if (msg.gif) content = `<img src="${msg.gif}" style="max-width:220px;border-radius:8px">`;
        else if (msg.image) content = `<img src="${msg.image}" class="msg-image">`;
        else content = `<div class="msg-text">${escapeHtml(msg.text)}</div>`;
        
        let status = isSent ? `<span class="msg-status ${msg.status === 'read' ? 'read' : ''}">${msg.status === 'sent' ? '✓' : '✓✓'}</span>` : '';
        html += `<div class="message ${isSent ? 'sent' : 'received'}"><div class="msg-bubble">${content}<div class="msg-meta">${status}</div></div></div>`;
    });
    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
}

function sendMessage(textData = null, gifUrl = null, imgUrl = null) {
    if (!activeChat) return;
    const text = textData !== null ? textData : document.getElementById('msgInput').value.trim();
    if (!text && !gifUrl && !imgUrl) return;
    
    const key = getChatId(currentUser.username, activeChat);
    let messages = DB.get('messages') || {};
    if (!messages[key]) messages[key] = [];
    
    messages[key].push({ id: genId(), from: currentUser.username, text: text || '', gif: gifUrl, image: imgUrl, time: Date.now(), status: 'sent' });
    DB.set('messages', messages);
    
    document.getElementById('msgInput').value = '';
    document.getElementById('pickerContainer').classList.remove('show');
    markAsRead(); renderMessages(); renderChatList();
}

function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file || !activeChat) return;
    const r = new FileReader();
    r.onload = ev => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX = 450; let w=img.width, h=img.height;
            if (w>MAX || h>MAX) { const rat=Math.min(MAX/w, MAX/h); w*=rat; h*=rat; }
            canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            sendMessage(null, null, canvas.toDataURL('image/jpeg', 0.75));
        }; img.src = ev.target.result;
    }; r.readAsDataURL(file);
}

function handleInputKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function escapeHtml(t) { return t.replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function clearChat() {
    if (!activeChat) return;
    let msgs = DB.get('messages') || {};
    msgs[getChatId(currentUser.username, activeChat)] = [];
    DB.set('messages', msgs);
    renderMessages(); renderChatList();
}

function switchPicker(type) {
    document.getElementById('tabEmoji').classList.toggle('active', type==='emoji');

    document.getElementById('emojiGrid').classList.toggle('show', type==='emoji');
    document.getElementById('gifGrid').classList.toggle('show', type==='gif');
}

function initPickers() {
    document.getElementById('emojiGrid').innerHTML = emojisList.map(e => `<div class="emoji-item" onclick="document.getElementById('msgInput').value+='${e}'">${e}</div>`).join('');
    document.getElementById('gifGrid').innerHTML = gifList.map(g => `<div class="gif-item" style="background-image:url(${g})" onclick="sendMessage(null,'${g}',null)"></div>`).join('');
}

function initAvatarPicker() {
    document.getElementById('avatarEmojis').innerHTML = avatarEmojis.map(e => `<div class="avatar-emoji-btn" onclick="document.getElementById('avatarPreview').textContent='${e}';document.getElementById('avatarPreview').style.backgroundImage='';delete document.getElementById('avatarPreview').dataset.b64">${e}</div>`).join('');
}

}

function startChatWith(u) { 
    document.getElementById('newChatOverlay').classList.add('hidden');

}

    p.classList.add('show');

            <div class="profile-display-name">${renderNameWithRole(currentUser)}</div>

function saveProfile() {
    const users = DB.get('users') || {};
    users[currentUser.username].displayName = document.getElementById('editName').value;

    updateSidebar(); 
    renderChatList();
    closeProfilePanel();
}

function openContactProfile() {
    if (!activeChat) return;
    const u = (DB.get('users') || {})[activeChat];
    const p = document.getElementById('profilePanel'); 
    p.classList.add('show');
    document.getElementById('profilePanelTitle').textContent = 'User Details';
    
    p.innerHTML = `

            <div class="profile-avatar-large" style="${renderAvatarStyle(u)}">${renderAvatarInner(u)}</div>
        </div>
        <div class="profile-details">
            <div class="profile-display-name">${renderNameWithRole(u)}</div>
            <p style="color:var(--text-secondary);margin-top:5px">@${u.username}</p>
        </div>
    `;
}

function closeProfilePanel() { document.getElementById('profilePanel').classList.remove('show'); }

// =============================================================================
// INIT
// =============================================================================
seedOwner();
initAvatarPicker();

const session = localStorage.getItem('cv_session');
if (session && (DB.get('users') || {})[session]) { 
    currentUser = DB.get('users')[session]; 
    enterApp(); 
} else { 
    document.getElementById('authOverlay').classList.remove('hidden'); 
}
</script>
