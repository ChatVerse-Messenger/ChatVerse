<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ChatVerse Messenger</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-main: #0b141a;
      --bg-sidebar: #111b21;
      --bg-header: #202c33;
      --bg-chat: #0b141a;
      --bg-input: #1d232a;
      --accent-primary: #00a884;
      --accent-hover: #00c89e;
      --text-main: #e9edef;
      --text-muted: #8696a0;
      --border-color: #222d34;
      --modal-bg: rgba(0, 0, 0, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { height: 100vh; background: var(--bg-main); color: var(--text-main); overflow: hidden; }

    /* --- ANIMATIONS --- */
    @keyframes rainbowText {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .rainbow-text {
      background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowText 3s linear infinite;
      font-weight: bold;
    }
    .owner-badge {
      background: linear-gradient(135deg, #00c89e, #005c4b);
      color: white; font-size: 10px; padding: 2px 8px; border-radius: 4px;
      margin-left: 8px; font-weight: 800; text-transform: uppercase;
    }

    #app { display: flex; height: 100vh; }

    /* --- SIDEBAR --- */
    .sidebar { width: 350px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-header); }
    
    .new-chat-btn {
      background: var(--bg-input);
      color: white;
      border: 1px solid rgba(255,255,255,0.05);
      padding: 18px 20px;
      margin: 15px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
    }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 15px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .chat-item.active { background: rgba(255,255,255,0.1); }

    .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #333; }

    /* --- CUSTOM MODAL SYSTEM (No more Popups!) --- */
    .modal-overlay {
      position: fixed; inset: 0; background: var(--modal-bg);
      display: none; align-items: center; justify-content: center; z-index: 1000;
      backdrop-filter: blur(5px);
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: var(--bg-sidebar); padding: 30px; border-radius: 20px;
      width: 90%; max-width: 400px; text-align: center; border: 1px solid var(--border-color);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .modal-card h2 { margin-bottom: 15px; font-size: 20px; }
    .modal-input {
      width: 100%; background: var(--bg-input); border: 1px solid #2a333c;
      padding: 14px; border-radius: 10px; color: white; outline: none; margin-bottom: 20px;
    }

    /* --- PROFILE VIEW --- */
    .profile-view {
      position: fixed; inset: 0; background: #0f171e; z-index: 100;
      display: none; flex-direction: column;
    }
    .profile-view.active { display: flex; }
    .profile-header { padding: 20px; display: flex; align-items: center; gap: 20px; font-size: 18px; font-weight: bold; background: var(--bg-header); }
    .profile-content { max-width: 400px; margin: 0 auto; width: 100%; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
    
    .pfp-main { width: 130px; height: 130px; border-radius: 50%; border: 4px solid #1d232a; cursor: pointer; }
    .profile-name-display { font-size: 24px; font-weight: bold; margin-top: 15px; display: flex; align-items: center; }

    .save-btn {
      width: 100%; padding: 16px; background: var(--accent-primary); color: white;
      border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px;
    }

    /* --- MAIN CHAT AREA --- */
    .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); }
    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 70%; padding: 12px 16px; border-radius: 12px; font-size: 14px; }
    .sent { align-self: flex-end; background: var(--accent-primary); color: white; }
    .received { align-self: flex-start; background: var(--bg-header); color: white; }
    .input-area { padding: 15px; background: var(--bg-header); display: flex; gap: 12px; }
    .chat-field { flex: 1; background: var(--bg-input); border: none; padding: 14px; border-radius: 25px; color: white; outline: none; }

    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="auth-screen" style="position:fixed; inset:0; background:var(--bg-main); z-index:2000; display:flex; align-items:center; justify-content:center;">
    <div style="background:var(--bg-sidebar); padding:40px; border-radius:24px; width:90%; max-width:400px; text-align:center; border:1px solid var(--border-color);">
      <h2 style="color:var(--accent-primary); margin-bottom:20px;">ChatVerse</h2>
      <input type="text" id="loginUser" class="modal-input" placeholder="Username">
      <input type="password" id="loginPass" class="modal-input" placeholder="Password">
      <button class="save-btn" onclick="handleLogin()">Sign In</button>
    </div>
  </div>

  <!-- CUSTOM MODAL: NEW CHAT -->
  <div id="newChatModal" class="modal-overlay">
    <div class="modal-card">
      <h2>Start New Chat</h2>
      <input type="text" id="newChatUser" class="modal-input" placeholder="Enter target username...">
      <div style="display:flex; gap:10px;">
        <button class="save-btn" style="background:#333;" onclick="closeModals()">Cancel</button>
        <button class="save-btn" onclick="confirmNewChat()">Start Chat</button>
      </div>
    </div>
  </div>

  <!-- CUSTOM MODAL: CHANGE PFP -->
  <div id="pfpModal" class="modal-overlay">
    <div class="modal-card">
      <h2>Change Profile Picture</h2>
      <p style="font-size:12px; color:gray; margin-bottom:15px;">Upload a file or enter an Image URL</p>
      <input type="file" id="pfpFile" class="hidden" onchange="uploadPfpFile(this)">
      <button class="save-btn" style="background:#2a333c; margin-bottom:10px;" onclick="document.getElementById('pfpFile').click()">Choose File from Device</button>
      <input type="text" id="pfpUrlInput" class="modal-input" placeholder="Or paste Image URL...">
      <div style="display:flex; gap:10px;">
        <button class="save-btn" style="background:#333;" onclick="closeModals()">Cancel</button>
        <button class="save-btn" onclick="confirmPfpUrl()">Save PFP</button>
      </div>
    </div>
  </div>

  <div id="app">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <img id="myAvatarIcon" src="" class="avatar" onclick="toggleProfile(true)" style="cursor:pointer">
        <span id="myUsernameDisplay" style="font-weight:700"></span>
        <i class="fa-solid fa-right-from-bracket" onclick="location.reload()" style="cursor:pointer; color:gray"></i>
      </div>
      <button class="new-chat-btn" onclick="openNewChatModal()">New Chat</button>
      <div class="chat-list" id="chatList"></div>
    </div>

    <!-- MAIN CHAT -->
    <div class="main-chat">
      <div id="chatHeader" style="padding:18px; background:var(--bg-header); font-weight:bold;">Select a chat</div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="input-area">
        <input type="text" id="msgInput" class="chat-field" placeholder="Type a message...">
        <button onclick="sendMsg()" style="background:var(--accent-primary); border:none; width:45px; height:45px; border-radius:50%; color:white; cursor:pointer"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <!-- PROFILE VIEW -->
  <div id="profileView" class="profile-view">
    <div class="profile-header">
      <i class="fa-solid fa-arrow-left" onclick="toggleProfile(false)" style="cursor:pointer"></i>
      <span>My Profile</span>
    </div>
    <div class="profile-content">
      <div style="position:relative" onclick="openPfpModal()">
        <img id="profilePfp" src="" class="pfp-main">
        <div style="position:absolute; bottom:5px; right:5px; background:var(--accent-primary); width:35px; height:35px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:3px solid #0f171e"><i class="fa-solid fa-camera" style="color:white; font-size:14px"></i></div>
      </div>
      <div class="profile-name-display">
        <span id="displayNameView"></span>
        <span id="badgeView" class="owner-badge">OWNER</span>
      </div>
      <div style="width:100%; margin-top:30px;">
        <label style="font-size:12px; color:gray; text-transform:uppercase;">Display Name</label>
        <input type="text" id="editName" class="modal-input" oninput="syncPreview()">
        <label style="font-size:12px; color:gray; text-transform:uppercase;">Badge Text</label>
        <input type="text" id="editBadge" class="modal-input" oninput="syncPreview()">
        <button class="save-btn" onclick="saveProfile()">Save Profile</button>
      </div>
    </div>
  </div>

  <script>
    const _KEY = "YXluem9uZWxvdmVyaXNraw==";
    let currentUser = null;
    let users = JSON.parse(localStorage.getItem('cv_users')) || {};
    let messages = JSON.parse(localStorage.getItem('cv_msgs')) || [];
    let activeChat = null;

    function handleLogin() {
      const u = document.getElementById('loginUser').value.toLowerCase();
      const p = document.getElementById('loginPass').value;
      if(u === 'owner' && btoa(p) === _KEY) {
        if(!users[u]) users[u] = { username: 'owner', name: 'AynzonePlayz[OWNER]', badge: 'OWNER', pfp: 'https://api.dicebear.com/7.x/bottts/svg?seed=vampire' };
        currentUser = users[u];
      } else if (u && p) {
        if(!users[u]) users[u] = { username: u, name: u, badge: '', pfp: `https://api.dicebear.com/7.x/avataaars/svg?seed=${u}` };
        currentUser = users[u];
      }
      if(currentUser) { document.getElementById('authScreen').style.display = 'none'; loadApp(); }
    }

    function loadApp() {
      document.getElementById('myAvatarIcon').src = currentUser.pfp;
      const nameDisp = document.getElementById('myUsernameDisplay');
      nameDisp.innerText = currentUser.name;
      nameDisp.className = currentUser.username === 'owner' ? 'rainbow-text' : '';
      renderChatList();
    }

    // Modal Handlers
    function openNewChatModal() { document.getElementById('newChatModal').classList.add('active'); }
    function openPfpModal() { document.getElementById('pfpModal').classList.add('active'); }
    function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); }

    function confirmNewChat() {
      const target = document.getElementById('newChatUser').value.toLowerCase();
      if(target && target !== currentUser.username) {
        activeChat = target;
        closeModals();
        renderChatList();
        renderMessages();
      }
    }

    function confirmPfpUrl() {
      const url = document.getElementById('pfpUrlInput').value;
      if(url) {
        currentUser.pfp = url;
        document.getElementById('profilePfp').src = url;
        closeModals();
      }
    }

    function uploadPfpFile(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentUser.pfp = e.target.result;
          document.getElementById('profilePfp').src = e.target.result;
          closeModals();
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function toggleProfile(show) {
      if(show) {
        document.getElementById('profilePfp').src = currentUser.pfp;
        document.getElementById('editName').value = currentUser.name;
        document.getElementById('editBadge').value = currentUser.badge;
        syncPreview();
        document.getElementById('profileView').classList.add('active');
      } else { document.getElementById('profileView').classList.remove('active'); }
    }

    function syncPreview() {
      const name = document.getElementById('editName').value;
      const badge = document.getElementById('editBadge').value;
      const nameEl = document.getElementById('displayNameView');
      nameEl.innerText = name || currentUser.username;
      if(currentUser.username === 'owner') nameEl.className = 'rainbow-text';
      const bView = document.getElementById('badgeView');
      bView.innerText = badge;
      bView.style.display = badge ? 'inline-block' : 'none';
    }

    function saveProfile() {
      currentUser.name = document.getElementById('editName').value;
      currentUser.badge = document.getElementById('editBadge').value;
      users[currentUser.username] = currentUser;
      localStorage.setItem('cv_users', JSON.stringify(users));
      loadApp();
      toggleProfile(false);
    }

    function renderChatList() {
      const list = document.getElementById('chatList');
      list.innerHTML = '';
      const contacts = [...new Set(messages.filter(m => m.to === currentUser.username || m.from === currentUser.username).map(m => m.to === currentUser.username ? m.from : m.to))];
      if(activeChat && !contacts.includes(activeChat)) contacts.push(activeChat);
      contacts.forEach(c => {
        const item = document.createElement('div');
        item.className = 'chat-item' + (activeChat === c ? ' active' : '');
        item.onclick = () => { activeChat = c; renderMessages(); renderChatList(); };
        item.innerHTML = `<img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${c}" class="avatar"> <div><div style="font-weight:bold">${c}</div><div style="font-size:12px; color:gray">Online</div></div>`;
        list.appendChild(item);
      });
    }

    function renderMessages() {
      if(!activeChat) return;
      document.getElementById('chatHeader').innerText = "Chatting with: " + activeChat;
      const container = document.getElementById('chatMessages');
      container.innerHTML = '';
      messages.filter(m => (m.from === currentUser.username && m.to === activeChat) || (m.from === activeChat && m.to === currentUser.username))
      .forEach(m => {
        const div = document.createElement('div');
        div.className = `message ${m.from === currentUser.username ? 'sent' : 'received'}`;
        div.innerText = m.text;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    }

    function sendMsg() {
      const input = document.getElementById('msgInput');
      if(!input.value || !activeChat) return;
      messages.push({ from: currentUser.username, to: activeChat, text: input.value });
      localStorage.setItem('cv_msgs', JSON.stringify(messages));
      input.value = '';
      renderMessages();
    }
  </script>
</body>
</html>
